name: Build RoadGuard GH Android app

# Runs when you press "Run workflow" on GitHub, or when files change.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx capacitor-assets generate --android --iconBackgroundColor '#050D22' --splashBackgroundColor '#050D22'
          npx cap sync android

      - name: Add the signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::The KEYSTORE_BASE64 secret is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          if [ -z "$KS_PW" ]; then echo "::error::The KEYSTORE_PASSWORD secret is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          # tolerate spaces/line breaks added when copying from a phone
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > android/app/roadguard.jks
          echo "Key file: $(wc -c < android/app/roadguard.jks) bytes (expected about 2650)"
          keytool -list -keystore android/app/roadguard.jks -storepass "$(printf '%s' "$KS_PW" | tr -d ' \r\n\t')" -storetype PKCS12 > /dev/null \
            || { echo "::error::The signing key or its password doesn't match. Re-copy both secrets from RoadGuard-signing-key-PRIVATE.txt."; exit 1; }

      - name: Build the app
        working-directory: android
        env:
          RG_STORE_PASSWORD_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export RG_STORE_PASSWORD="$(printf '%s' "$RG_STORE_PASSWORD_RAW" | tr -d ' \r\n\t')"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../RoadGuardGH.apk

      - name: Save the app file
        uses: actions/upload-artifact@v5
        with:
          name: RoadGuardGH-android-app
          path: RoadGuardGH.apk

      - name: Publish the app file to the "apk" branch
        run: |
          mkdir -p /tmp/out && cp RoadGuardGH.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add RoadGuardGH.apk && git commit -qm "RoadGuard GH app, build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
